<!DOCTYPE html>
<html lang="do">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lorhels CV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: #0f172a !important; padding: 0; color: white !important; }
            .cv-container { box-shadow: none; border: none; width: 100%; max-width: 100%; margin: 0; }
        }
        .animate-fade-in { animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Scrollbar personalizada para Modo Oscuro */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body class="bg-slate-900 text-slate-200 font-sans min-h-screen flex flex-col selection:bg-blue-500 selection:text-white">

    <nav class="bg-slate-950 text-white p-4 shadow-xl border-b border-slate-800 no-print">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-xl font-black tracking-tighter cursor-pointer hover:text-blue-400 transition-colors" onclick="window.location.reload()">
                LORHELS<span class="text-blue-500">-CV</span>
            </h1>
            <div id="auth-status" class="flex items-center gap-4">
                <div id="role-display" class="text-[10px] font-bold bg-slate-800 text-blue-400 px-3 py-1 rounded-full border border-slate-700 uppercase shadow-inner">Cargando...</div>
                <button id="logout-btn" onclick="location.reload()" class="hidden text-xs bg-red-900/30 text-red-400 hover:bg-red-600 hover:text-white px-3 py-1 rounded transition-all border border-red-900/50">Salir</button>
            </div>
        </div>
    </nav>

    <main id="app-container" class="container mx-auto mt-6 px-4 pb-32 flex-1">
        <div class="flex justify-center items-center h-64">
            <div class="animate-spin rounded-full h-12 w-12 border-4 border-slate-700 border-t-blue-500"></div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, getDocs, collection, query, addDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDE0BPfySfOJTOPLGdCnENlHVEyX6wJusU",
            authDomain: "lorhels-cv.firebaseapp.com",
            projectId: "lorhels-cv",
            storageBucket: "lorhels-cv.firebasestorage.app",
            messagingSenderId: "769611552220",
            appId: "1:769611552220:web:03350cab69f08d7622eb19"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'lorhels-cv'; 

        let currentUser = null; 

        // --- SISTEMA DE NOTIFICACIONES (TOAST) ---
        window.showToast = (message, type = 'success') => {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed top-5 right-5 z-[99999] flex flex-col gap-3 pointer-events-none';
                document.body.appendChild(container);
            }

            const toast = document.createElement('div');
            let bgColor, icon;
            
            if (type === 'success') { bgColor = 'bg-emerald-600 border-emerald-500'; icon = 'fa-check-circle'; } 
            else if (type === 'error') { bgColor = 'bg-red-600 border-red-500'; icon = 'fa-exclamation-triangle'; } 
            else { bgColor = 'bg-blue-600 border-blue-500'; icon = 'fa-info-circle'; }

            toast.className = `${bgColor} border text-white px-5 py-4 rounded-2xl shadow-[0_5px_20px_rgba(0,0,0,0.5)] flex items-center gap-3 transform transition-all duration-300 translate-x-full opacity-0 max-w-sm w-full`;
            toast.innerHTML = `<i class="fas ${icon} text-xl flex-shrink-0"></i><p class="text-sm font-medium leading-tight">${message}</p>`;

            container.appendChild(toast);

            // Animar entrada
            requestAnimationFrame(() => {
                toast.classList.remove('translate-x-full', 'opacity-0');
            });

            // Animar salida y remover
            setTimeout(() => {
                toast.classList.add('translate-x-full', 'opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        // --- SISTEMA DE SESIONES INTELIGENTE ---
        async function init() {
            try {
                onAuthStateChanged(auth, async (user) => {
                    try {
                        const params = new URLSearchParams(window.location.search);
                        const cvId = params.get('cv');

                        if (user && !user.isAnonymous) {
                            const userDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios_sistema', user.uid));
                            
                            if (userDoc.exists()) {
                                let uData = userDoc.data();
                                
                                if (uData.plan === 'pro' && uData.expiracion_plan) {
                                    const ahora = new Date().getTime();
                                    if (ahora > uData.expiracion_plan) {
                                        uData.plan = 'gratis';
                                        await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios_sistema', user.uid), { plan: 'gratis' });
                                        showToast("Tu plan PRO ha expirado. Has vuelto al plan Básico.", "info");
                                    }
                                }

                                currentUser = { id: user.uid, ...uData };
                                
                                const logoutBtn = document.getElementById('logout-btn');
                                if(logoutBtn) {
                                    logoutBtn.classList.remove('hidden');
                                    logoutBtn.onclick = async () => { await signOut(auth); location.href = window.location.pathname; };
                                }
                                const roleDisp = document.getElementById('role-display');
                                if(roleDisp) roleDisp.innerText = uData.tipo.toUpperCase();
                                
                                if (cvId) {
                                    if(uData.tipo === 'empresa' || uData.tipo === 'admin') {
                                        await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'visitas'), {
                                            empresa_nombre: uData.nombre, empresa_email: uData.email, cv_id: cvId, fecha: new Date().toLocaleString(), timestamp: serverTimestamp()
                                        });
                                        loadCV(cvId);
                                    } else {
                                        showToast("Debes iniciar sesión con una cuenta de Empresa para ver este currículum.", "error");
                                        await signOut(auth);
                                        setTimeout(() => location.reload(), 1500);
                                    }
                                } else {
                                    if (currentUser.tipo === 'admin') renderAdminPanel();
                                    else if (currentUser.tipo === 'empresa') renderEmpresaDashboard(currentUser);
                                    else renderDashboard(currentUser, false);
                                }
                            } else {
                                await signOut(auth);
                                renderWelcome();
                            }
                        } else {
                            if (!user) { try { await signInAnonymously(auth); } catch(err) {} }
                            if (cvId) renderAccessForm(cvId); 
                            else renderWelcome();
                        }
                    } catch(e) { console.error(e); renderWelcome(); }
                });
            } catch (e) { console.error(e); }
        }

        // --- PANTALLAS PRINCIPALES ---
        function renderWelcome() {
            const roleDisp = document.getElementById('role-display');
            if(roleDisp) roleDisp.innerText = "Visitante";
            
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="max-w-5xl mx-auto py-16 text-center animate-fade-in">
                    <h2 class="text-6xl font-black mb-6 text-white tracking-tight">Potencia tu <span class="text-blue-500">Carrera</span></h2>
                    <p class="text-slate-400 mb-12 text-xl max-w-2xl mx-auto">Crea un CV digital profesional con acceso vía QR para empresas y reclutadores.</p>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 max-w-4xl mx-auto">
                        <div onclick="renderAuthOption('admin')" class="bg-slate-800 p-8 rounded-3xl border border-slate-700 hover:border-blue-500 hover:shadow-2xl transition-all cursor-pointer group">
                            <div class="w-14 h-14 bg-slate-900 rounded-2xl flex items-center justify-center mx-auto mb-4 text-slate-400 group-hover:bg-blue-600 group-hover:text-white transition-colors"><i class="fas fa-lock"></i></div>
                            <h3 class="font-black text-white">ADMIN</h3>
                        </div>
                        <div onclick="renderAuthOption('usuario')" class="bg-slate-800 p-10 rounded-3xl border-2 border-blue-900/50 shadow-xl hover:-translate-y-2 hover:border-blue-500 transition-all cursor-pointer group">
                            <div class="w-16 h-16 bg-blue-900/30 text-blue-400 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:bg-blue-600 group-hover:text-white transition-colors"><i class="fas fa-user-tie text-2xl"></i></div>
                            <h3 class="font-black text-blue-400">CANDIDATO</h3>
                        </div>
                        <div onclick="renderAuthOption('empresa')" class="bg-slate-800 p-8 rounded-3xl border border-slate-700 hover:border-blue-500 hover:shadow-2xl transition-all cursor-pointer group">
                            <div class="w-14 h-14 bg-slate-900 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-4 group-hover:bg-blue-600 group-hover:text-white transition-colors"><i class="fas fa-building"></i></div>
                            <h3 class="font-black text-white">EMPRESA</h3>
                        </div>
                    </div>
                </div>`;
        }

        window.renderAuthOption = (type) => {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="max-w-md mx-auto py-10 animate-fade-in">
                    <button onclick="renderWelcome()" class="mb-6 text-slate-400 hover:text-blue-400 flex items-center gap-2 transition-colors"><i class="fas fa-arrow-left"></i> Volver</button>
                    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
                        <h2 class="text-2xl font-black mb-8 text-center uppercase tracking-widest text-white">Portal ${type}</h2>
                        <div class="space-y-4">
                            <button onclick="renderLogin('${type}')" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold shadow-lg hover:bg-blue-500 transition-colors">Iniciar Sesión</button>
                            ${type !== 'admin' ? `<button onclick="renderRegister('${type}')" class="w-full border border-slate-600 text-slate-300 py-4 rounded-2xl font-bold hover:bg-slate-700 hover:text-white transition-colors">Crear Cuenta Nueva</button>` : ''}
                        </div>
                    </div>
                </div>`;
        };

        // --- LOGIN SEGURO CON FIREBASE AUTH ---
        window.renderLogin = (type) => {
            document.getElementById('app-container').innerHTML = `
                <div class="max-w-md mx-auto py-10 animate-fade-in">
                    <button onclick="renderAuthOption('${type}')" class="mb-6 text-slate-400 hover:text-blue-400 flex items-center gap-2"><i class="fas fa-arrow-left"></i> Atrás</button>
                    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
                        <h2 class="text-xl font-bold mb-6 text-center text-white">LOGIN ${type.toUpperCase()}</h2>
                        <form id="login-form" class="space-y-4">
                            <input type="email" id="log-email" placeholder="Correo Electrónico" required class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                            <input type="password" id="log-pass" placeholder="Contraseña" required class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500 transition-all">
                            <button type="submit" class="w-full bg-blue-600 text-white py-4 rounded-2xl font-bold hover:bg-blue-500 transition-colors">ENTRAR</button>
                        </form>
                    </div>
                </div>`;
            
            document.getElementById('login-form').onsubmit = async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Verificando...';
                
                try {
                    const cred = await signInWithEmailAndPassword(auth, document.getElementById('log-email').value, document.getElementById('log-pass').value);
                    const userDoc = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios_sistema', cred.user.uid));
                    if(userDoc.exists() && userDoc.data().tipo !== type && userDoc.data().tipo !== 'admin') {
                        showToast("Esta cuenta pertenece a otro portal.", "error");
                        await signOut(auth);
                        btn.innerHTML = 'ENTRAR';
                        return;
                    }
                    location.reload();
                } catch(error) {
                    showToast("Correo o contraseña incorrectos.", "error");
                    btn.innerHTML = 'ENTRAR';
                }
            };
        };

        // --- REGISTRO SEGURO CON FIREBASE AUTH ---
        window.renderRegister = (type) => {
            document.getElementById('app-container').innerHTML = `
                <div class="max-w-md mx-auto py-10 animate-fade-in">
                    <button onclick="renderAuthOption('${type}')" class="mb-6 text-slate-400 hover:text-blue-400 flex items-center gap-2"><i class="fas fa-arrow-left"></i> Atrás</button>
                    <div class="bg-slate-800 p-8 rounded-3xl shadow-2xl border border-slate-700">
                        <h2 class="text-xl font-bold mb-6 text-center uppercase text-white">Registro ${type}</h2>
                        <form id="reg-form" class="space-y-4">
                            <input type="text" id="reg-name" placeholder="${type === 'empresa' ? 'Nombre de la Empresa' : 'Nombre Completo'}" required class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="email" id="reg-email" placeholder="Email" required class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500">
                            <input type="password" id="reg-pass" placeholder="Contraseña segura" required class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white placeholder-slate-500 outline-none focus:ring-2 focus:ring-blue-500" minlength="6">
                            <button type="submit" class="w-full bg-slate-700 text-white py-4 rounded-2xl font-bold hover:bg-slate-600 transition-colors border border-slate-600">CREAR CUENTA</button>
                        </form>
                    </div>
                </div>`;
                
            document.getElementById('reg-form').onsubmit = async (e) => {
                e.preventDefault();
                const btn = e.target.querySelector('button');
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creando...';
                
                try {
                    const cred = await createUserWithEmailAndPassword(auth, document.getElementById('reg-email').value, document.getElementById('reg-pass').value);
                    await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios_sistema', cred.user.uid), {
                        nombre: document.getElementById('reg-name').value,
                        email: document.getElementById('reg-email').value,
                        tipo: type,
                        plan: 'gratis',
                        timestamp: serverTimestamp()
                    });
                    
                    showToast("¡Cuenta segura creada con éxito!", "success");
                    setTimeout(() => location.reload(), 1500);
                } catch(error) {
                    showToast("Error: " + error.message, "error");
                    btn.innerHTML = 'CREAR CUENTA';
                }
            };
        };

        // --- DASHBOARD DE LA EMPRESA ---
        async function renderEmpresaDashboard(user) {
            const container = document.getElementById('app-container');
            const isPremium = user.plan === 'pro' || user.tipo === 'admin';

            if (!isPremium) {
                container.innerHTML = `
                    <div class="max-w-5xl mx-auto py-12 animate-fade-in text-center">
                        <div class="bg-slate-800 p-12 rounded-3xl border border-slate-700 mb-8 shadow-sm">
                            <div class="w-20 h-20 bg-amber-500/10 text-amber-500 rounded-full flex items-center justify-center mx-auto mb-6">
                                <i class="fas fa-lock text-3xl"></i>
                            </div>
                            <h2 class="text-3xl font-black mb-4 text-white">Buscador Global Bloqueado</h2>
                            <p class="text-slate-400 mb-8 max-w-lg mx-auto text-lg">
                                Tu cuenta actual <b>(Gratis)</b> solo te permite ver los currículums cuando escaneas directamente el código QR de un candidato.
                            </p>
                            <button onclick="renderPaywall('empresa')" class="bg-amber-500 text-slate-900 px-8 py-4 rounded-2xl font-black shadow-lg hover:bg-amber-400 transition-colors uppercase tracking-widest inline-flex items-center gap-2">
                                <i class="fas fa-crown"></i> Desbloquear Premium
                            </button>
                        </div>
                    </div>`;
                return;
            }

            container.innerHTML = `
                <div class="max-w-6xl mx-auto py-8 animate-fade-in">
                    <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 mb-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-lg">
                        <div>
                            <h2 class="text-3xl font-black flex items-center gap-3 text-white">
                                <i class="fas fa-crown text-amber-500"></i> Portal Premium
                            </h2>
                            <p class="text-slate-400 mt-1">Bienvenido, ${user.nombre}. Busca y guarda el mejor talento.</p>
                        </div>
                        <div class="w-full md:w-1/2 relative">
                            <i class="fas fa-search absolute left-4 top-4 text-slate-500"></i>
                            <input type="text" id="buscador-talento" placeholder="Buscar por profesión, nombre o habilidad..." 
                                class="w-full pl-11 p-3 bg-slate-900 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:ring-2 focus:ring-blue-500 outline-none transition-all" 
                                oninput="filtrarTalento(this.value)">
                        </div>
                    </div>

                    <div class="mb-6 flex gap-3 border-b border-slate-800 pb-4">
                        <button onclick="mostrarTodos()" class="text-sm font-bold text-blue-400 bg-blue-900/30 border border-blue-900/50 px-5 py-2.5 rounded-xl hover:bg-blue-900/50 transition-colors">Todos los Candidatos</button>
                        <button onclick="mostrarFavoritos()" class="text-sm font-bold text-pink-400 bg-pink-900/20 border border-pink-900/30 px-5 py-2.5 rounded-xl hover:bg-pink-900/40 transition-colors flex items-center gap-2">
                            <i class="fas fa-heart"></i> Mis Favoritos
                        </button>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6" id="cv-grid">
                        <div class="col-span-full text-center py-10 text-slate-500"><i class="fas fa-spinner fa-spin text-3xl mb-3"></i><p>Cargando talentos...</p></div>
                    </div>
                </div>`;

            window.allCVs = [];
            const cvsSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'cvs'));
            cvsSnap.forEach(d => { window.allCVs.push({ id: d.id, ...d.data() }); });

            if (!currentUser.favoritos) currentUser.favoritos = [];
            dibujarGridCVs(window.allCVs);
        }

        window.dibujarGridCVs = (cvList) => {
            const grid = document.getElementById('cv-grid');
            grid.innerHTML = '';
            
            if (cvList.length === 0) {
                grid.innerHTML = '<p class="text-slate-500 col-span-full text-center py-10 bg-slate-800 rounded-2xl border border-dashed border-slate-700">No se encontraron candidatos.</p>';
                return;
            }

            cvList.forEach(cv => {
                const esFavorito = currentUser.favoritos && currentUser.favoritos.includes(cv.id);
                const corazon = esFavorito ? 'fas text-pink-500' : 'far text-slate-600 hover:text-pink-400';

                grid.innerHTML += `
                    <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 hover:shadow-2xl hover:shadow-blue-900/20 transition-all relative group flex flex-col h-full hover:border-blue-500">
                        <button onclick="toggleFavorito('${cv.id}')" class="absolute top-4 right-4 text-xl z-10 p-2 bg-slate-900/80 rounded-full backdrop-blur-sm shadow-sm transition-transform hover:scale-110 border border-slate-700">
                            <i class="fa-heart ${corazon}" id="fav-icon-${cv.id}"></i>
                        </button>
                        
                        <div class="w-16 h-16 bg-slate-900 text-blue-500 border border-slate-700 rounded-2xl flex items-center justify-center mb-4 overflow-hidden group-hover:border-blue-500 transition-colors flex-shrink-0">
                            ${cv.foto ? `<img src="${cv.foto}" class="w-full h-full object-cover">` : `<i class="fas fa-user-tie text-2xl"></i>`}
                        </div>
                        
                        <div class="flex-1">
                            <h3 class="font-bold text-lg text-white leading-tight">${cv.nombre}</h3>
                            <p class="text-blue-400 text-xs font-black mb-2 uppercase tracking-wide mt-1">${cv.profesion || 'Candidato'}</p>
                            <p class="text-[11px] text-slate-400 line-clamp-3 mb-4 leading-relaxed">${cv.objetivo || 'Sin descripción de perfil.'}</p>
                        </div>
                        
                        <button onclick="loadCV('${cv.id}')" class="w-full py-3 bg-blue-600 text-white rounded-xl text-xs font-black hover:bg-blue-500 transition-colors mt-auto shadow-lg shadow-blue-900/20">VER PERFIL</button>
                    </div>`;
            });
        };

        window.filtrarTalento = (queryStr) => {
            const q = queryStr.toLowerCase();
            const filtrados = window.allCVs.filter(cv => 
                (cv.nombre && cv.nombre.toLowerCase().includes(q)) || 
                (cv.profesion && cv.profesion.toLowerCase().includes(q)) ||
                (cv.objetivo && cv.objetivo.toLowerCase().includes(q))
            );
            dibujarGridCVs(filtrados);
        };

        window.mostrarTodos = () => {
            document.getElementById('buscador-talento').value = '';
            dibujarGridCVs(window.allCVs);
        };

        window.mostrarFavoritos = () => {
            document.getElementById('buscador-talento').value = '';
            const favs = window.allCVs.filter(cv => currentUser.favoritos && currentUser.favoritos.includes(cv.id));
            dibujarGridCVs(favs);
        };

        window.toggleFavorito = async (cvId) => {
            if(!currentUser.favoritos) currentUser.favoritos = [];
            const index = currentUser.favoritos.indexOf(cvId);
            
            if(index > -1) {
                currentUser.favoritos.splice(index, 1); 
                document.getElementById('fav-icon-'+cvId).className = 'fa-heart far text-slate-600 hover:text-pink-400';
                showToast("Eliminado de favoritos", "info");
            } else {
                currentUser.favoritos.push(cvId); 
                document.getElementById('fav-icon-'+cvId).className = 'fa-heart fas text-pink-500';
                showToast("Guardado en favoritos", "success");
            }

            try {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios_sistema', currentUser.id), {
                    favoritos: currentUser.favoritos
                });
            } catch(e) { console.error("Error guardando favorito:", e); }
        };

        // --- DASHBOARD DEL CANDIDATO (Con editor de Habilidades) ---
        async function renderDashboard(targetUser, isAdminEditing = false) {
            const cvsSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'cvs'));
            let cv = null;
            cvsSnap.forEach(d => { if (d.data().email === targetUser.email) cv = {id: d.id, ...d.data()}; });

            let totalVisitas = 0;
            if (cv) {
                const visitasSnap = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'visitas'));
                visitasSnap.forEach(d => { if (d.data().cv_id === cv.id) totalVisitas++; });

            const isFullAccess = isAdminEditing || (currentUser && currentUser.tipo === 'admin');

            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="max-w-5xl mx-auto py-8 animate-fade-in">

                            <p class="text-slate-400">Editando perfil de: ${targetUser.email}</p>
                        </div>
                        <div class="flex gap-4 flex-wrap">
                            ${isFullAccess ? `<button onclick="renderAdminPanel()" class="bg-slate-700 text-white px-6 py-3 rounded-2xl font-bold border border-slate-600 hover:bg-slate-600">Volver a Consola</button>` : ''}
                            ${cv ? `
                                <button onclick="showVisitas('${cv.id}')" class="bg-blue-900/30 text-blue-400 px-6 py-3 rounded-2xl font-bold border border-blue-800 hover:bg-blue-900/50 flex items-center gap-2 transition-colors shadow-sm">
                                    <i class="fas fa-chart-line"></i> ${totalVisitas} VISTAS
                                </button>
                                
                                <button onclick="showQR('${cv.id}')" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-bold flex items-center gap-2 hover:bg-blue-500 transition-colors"><i class="fas fa-qrcode"></i> MI QR</button>
                                <button onclick="loadCV('${cv.id}')" class="bg-slate-900 text-white px-6 py-3 rounded-2xl font-bold border border-slate-700 hover:border-slate-500 flex items-center gap-2 transition-colors"><i class="fas fa-eye"></i> VISTA PREVIA</button>
                            ` : ''}
                        </div>
                    </div>

                    <form id="cv-full-form" class="space-y-10">
                        <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-sm">
                            <h3 class="font-black text-blue-400 mb-6 text-xs uppercase border-b border-slate-700 pb-2"><i class="fas fa-user"></i> 1. Información General</h3>
                            
                            <div class="flex items-center gap-6 mb-6 bg-slate-900 p-4 rounded-2xl border border-dashed border-slate-700">
                                <img id="cv-foto-preview" src="${cv?.foto || 'https://via.placeholder.com/150'}" class="w-24 h-24 rounded-full object-cover border-4 border-slate-800 shadow-md">
                                <div class="flex-1">
                                    <label class="block text-xs font-bold text-slate-400 mb-1">URL de Foto de Perfil</label>
                                    <input type="url" id="cv-foto" value="${cv?.foto || ''}" placeholder="Ej: https://ejemplo.com/mifoto.jpg" class="w-full p-3 bg-slate-800 border border-slate-700 rounded-xl text-sm text-white outline-none focus:border-blue-500" oninput="document.getElementById('cv-foto-preview').src = this.value || 'https://via.placeholder.com/150'">
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
                                <input type="text" id="cv-nombre" value="${cv?.nombre || targetUser.nombre}" placeholder="Nombre Completo" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white outline-none focus:border-blue-500">
                                <input type="text" id="cv-prof" value="${cv?.profesion || ''}" placeholder="Profesión / Título" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white outline-none focus:border-blue-500">
                                <input type="text" id="cv-dir" value="${cv?.direccion || ''}" placeholder="Dirección Residencial" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white outline-none focus:border-blue-500">
                                <input type="text" id="cv-tel" value="${cv?.telefono || ''}" placeholder="Teléfono" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white outline-none focus:border-blue-500">
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                                <div class="relative"><i class="fab fa-linkedin absolute left-4 top-5 text-blue-500"></i><input type="text" id="cv-lin" value="${cv?.redes?.linkedin || ''}" placeholder="LinkedIn URL" class="p-4 pl-10 bg-slate-900 border border-slate-700 rounded-2xl w-full text-xs text-white outline-none focus:border-blue-500"></div>
                                <div class="relative"><i class="fab fa-facebook absolute left-4 top-5 text-blue-400"></i><input type="text" id="cv-fb" value="${cv?.redes?.facebook || ''}" placeholder="Facebook URL" class="p-4 pl-10 bg-slate-900 border border-slate-700 rounded-2xl w-full text-xs text-white outline-none focus:border-blue-500"></div>
                                <div class="relative"><i class="fab fa-instagram absolute left-4 top-5 text-pink-500"></i><input type="text" id="cv-ig" value="${cv?.redes?.instagram || ''}" placeholder="Instagram URL" class="p-4 pl-10 bg-slate-900 border border-slate-700 rounded-2xl w-full text-xs text-white outline-none focus:border-blue-500"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                            <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700">
                                <h3 class="font-black text-blue-400 mb-4 text-xs uppercase">2. Objetivo Profesional</h3>
                                <textarea id="cv-obj" rows="5" class="w-full p-4 bg-slate-900 border border-slate-700 rounded-2xl text-white outline-none focus:border-blue-500">${cv?.objetivo || ''}</textarea>
                            </div>
                            <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700">
                                <h3 class="font-black text-blue-400 mb-4 text-xs uppercase">3. Información Personal</h3>
                                <div class="grid grid-cols-2 gap-4">
                                    <input type="text" id="cv-ced" value="${cv?.info_personal?.cedula || ''}" placeholder="Cédula" class="p-4 bg-slate-900 border border-slate-700 rounded-2xl text-sm text-white outline-none focus:border-blue-500">
                                    <input type="text" id="cv-civil" value="${cv?.info_personal?.estado_civil || ''}" placeholder="Estado Civil" class="p-4 bg-slate-900 border border-slate-700 rounded-2xl text-sm text-white outline-none focus:border-blue-500">
                                    <input type="text" id="cv-nac" value="${cv?.info_personal?.nacionalidad || ''}" placeholder="Nacionalidad" class="p-4 bg-slate-900 border border-slate-700 rounded-2xl text-sm text-white outline-none focus:border-blue-500">
                                    <input type="text" id="cv-birth" value="${cv?.info_personal?.nacimiento || ''}" placeholder="F. Nacimiento" class="p-4 bg-slate-900 border border-slate-700 rounded-2xl text-sm text-white outline-none focus:border-blue-500">
                                </div>
                            </div>
                        </div>

                        ${isFullAccess ? `
                            <div class="space-y-8">
                                ${renderEditorSection("Experiencia Laboral", "exp", cv?.experiencia, ["Empresa", "Cargo", "Tiempo", "Descripción"], false)}
                                ${renderEditorSection("Educación Académica", "edu", cv?.educacion, ["Centro", "Carrera", "Estado"], true)}
                                ${renderEditorSection("Cursos y Talleres", "cur", cv?.cursos, ["Nombre del Curso", "Lugar"], true)}
                                ${renderEditorSection("Diplomados", "dip", cv?.diplomados, ["Nombre del Diplomado", "Lugar"], true)}
                                ${renderEditorSection("Referencias Laborales", "ref", cv?.referencias, ["Nombre", "Empresa", "Cargo", "Teléfono"], false)}
                            </div>

                            <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-sm mt-8">
                                <h3 class="font-black text-blue-400 mb-6 text-xs uppercase border-b border-slate-700 pb-2">Habilidades, Idiomas e Intereses</h3>
                                
                                <div class="mb-8">
                                    <div class="flex justify-between items-center mb-4">
                                        <label class="text-[10px] font-black text-slate-500">LISTA DE HABILIDADES</label>
                                        <button type="button" id="btn-add-hab" class="text-[10px] bg-slate-700 text-white border border-slate-600 px-3 py-1.5 rounded-full hover:bg-blue-600 transition-colors shadow-sm">+ Añadir Habilidad</button>
                                    </div>
                                    <div id="hab-container" class="space-y-3">
                                        ${cv?.habilidades_lista?.map(h => `
                                            <div class="grid grid-cols-1 md:grid-cols-2 gap-2 p-4 bg-slate-900 rounded-2xl border border-slate-700 relative animate-fade-in">
                                                <input type="text" placeholder="Habilidad (Ej: Liderazgo)" value="${h.nombre}" class="p-2 border border-slate-700 bg-slate-800 rounded-lg text-sm text-white hab-nom outline-none focus:border-blue-500">
                                                <input type="text" placeholder="Descripción breve" value="${h.desc}" class="p-2 border border-slate-700 bg-slate-800 rounded-lg text-sm text-white hab-des outline-none focus:border-blue-500">
                                                <button type="button" onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 bg-red-600 text-white w-6 h-6 rounded-full text-xs shadow">×</button>
                                            </div>
                                        `).join('') || ''}
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="space-y-2">
                                        <label class="text-[10px] font-black text-slate-500">IDIOMAS</label>
                                        <input type="text" id="cv-idi" value="${cv?.idiomas || ''}" placeholder="Ej: Inglés (Avanzado), Español (Nativo)" class="p-4 bg-slate-900 border border-slate-700 rounded-2xl w-full text-sm text-white outline-none focus:border-blue-500">
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-[10px] font-black text-slate-500">INTERESES</label>
                                        <input type="text" id="cv-int" value="${cv?.intereses || ''}" placeholder="Ej: Tecnología, Diseño, Lectura" class="p-4 bg-slate-900 border border-slate-700 rounded-2xl w-full text-sm text-white outline-none focus:border-blue-500">
                                    </div>
                                </div>
                            </div>
                        ` : `
                            <div class="bg-blue-900/10 border border-blue-900/50 p-8 rounded-3xl flex flex-col items-start gap-4 shadow-sm">
                                <div class="flex gap-4 items-start w-full">
                                    <div class="bg-blue-600 text-white w-10 h-10 rounded-full flex items-center justify-center flex-shrink-0">
                                        <i class="fas fa-lock"></i>
                                    </div>

                                        <h3 class="font-black text-blue-400 mb-2">Secciones Protegidas</h3>
                                        <p class="text-sm text-slate-300 leading-relaxed mb-4">
                                            Tu Experiencia Laboral, Educación, Cursos y Certificaciones son validadas por la plataforma y solo pueden ser modificadas por el administrador.
                                        </p>
                                        <button type="button" onclick="document.getElementById('solicitud-box').classList.toggle('hidden')" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl text-xs font-bold hover:bg-blue-500 transition-colors shadow-md">
                                            <i class="fas fa-paper-plane mr-1"></i> Enviar Solicitud de Actualización
                                        </button>
                                    </div>
                                </div>
                                
                                <div id="solicitud-box" class="hidden w-full mt-4 bg-slate-900 p-6 rounded-2xl border border-slate-700 shadow-inner">
                                    <label class="block text-xs font-bold text-slate-400 mb-2">Detalles de la modificación:</label>
                                    <textarea id="sol-texto" rows="4" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl mb-4 text-sm text-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="Ej: Por favor añadir a mi experiencia... o añadir la Habilidad: Trabajo en Equipo"></textarea>
                                    
                                    <label class="block text-xs font-bold text-slate-400 mb-2">URL del Certificado (Opcional):</label>
                                    <input type="url" id="sol-url" class="w-full p-4 bg-slate-800 border border-slate-700 rounded-xl mb-6 text-sm text-white outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enlace a tu certificado, Drive, etc.">
                                    
                                    <button type="button" onclick="enviarSolicitud('${targetUser.email}', '${targetUser.nombre}')" class="bg-slate-700 border border-slate-600 text-white px-6 py-3 rounded-xl text-sm font-bold hover:bg-slate-600 transition-colors w-full shadow-lg">
                                        Enviar a Revisión
                                    </button>
                                </div>
                            </div>
                        `}

                        <button id="btn-submit" type="submit" class="w-full ${isFullAccess ? 'bg-red-600 shadow-red-900/50 hover:bg-red-500' : 'bg-blue-600 shadow-blue-900/50 hover:bg-blue-500'} text-white py-6 rounded-3xl font-black text-xl shadow-2xl transition-all uppercase tracking-widest">
                            ${isFullAccess ? 'Guardar Cambios como Admin' : 'Actualizar Mi Perfil Básico'}
                        </button>
                    </form>
                </div>`;

            if (isFullAccess) {
                setupDynamicButtons();
                
                const btnAddHab = document.getElementById('btn-add-hab');
                if(btnAddHab) {
                    btnAddHab.onclick = () => {
                        const container = document.getElementById('hab-container');
                        const div = document.createElement('div');
                        div.className = "grid grid-cols-1 md:grid-cols-2 gap-2 p-4 bg-slate-900 rounded-2xl border border-slate-700 relative animate-fade-in";
                        div.innerHTML = `
                            <input type="text" placeholder="Habilidad (Ej: Liderazgo)" class="p-2 border border-slate-700 bg-slate-800 rounded-lg text-sm text-white hab-nom outline-none focus:border-blue-500">
                            <input type="text" placeholder="Descripción breve" class="p-2 border border-slate-700 bg-slate-800 rounded-lg text-sm text-white hab-des outline-none focus:border-blue-500">
                            <button type="button" onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 bg-red-600 text-white w-6 h-6 rounded-full text-xs shadow">×</button>
                        `;
                        container.appendChild(div);
                    };
                }
            }

            document.getElementById('cv-full-form').onsubmit = async (e) => {
                e.preventDefault();
                const btn = document.getElementById('btn-submit');
                const btnText = btn.innerText;
                btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Guardando...';

                try {
                    const payload = {
                        nombre: document.getElementById('cv-nombre').value,
                        profesion: document.getElementById('cv-prof').value,
                        direccion: document.getElementById('cv-dir').value,
                        telefono: document.getElementById('cv-tel').value,
                        email: targetUser.email,
                        foto: document.getElementById('cv-foto').value, 
                        redes: {
                            linkedin: document.getElementById('cv-lin').value,
                            facebook: document.getElementById('cv-fb').value,
                            instagram: document.getElementById('cv-ig').value
                        },
                        objetivo: document.getElementById('cv-obj').value,
                        info_personal: {
                            cedula: document.getElementById('cv-ced').value,
                            estado_civil: document.getElementById('cv-civil').value,
                            nacionalidad: document.getElementById('cv-nac').value,
                            nacimiento: document.getElementById('cv-birth').value
                        },
                        timestamp: serverTimestamp()
                    };

                    if (isFullAccess) {
                        const getSectionData = (id, fieldsCount, hasImage) => {
                            const rows = Array.from(document.querySelectorAll(`#${id}-container > div`));
                            const data = [];
                            for (let row of rows) {
                                const item = {};
                                for (let i = 0; i < fieldsCount; i++) {
                                    item[`f${i}`] = row.querySelector(`.${id}-field-${i}`).value;
                                }
                                if (hasImage) item.img = row.querySelector(`.${id}-img-url`).value;
                                data.push(item);
                            }
                            return data;
                        };

                        payload.experiencia = getSectionData('exp', 4, false);
                        payload.educacion = getSectionData('edu', 3, true);
                        payload.cursos = getSectionData('cur', 2, true);
                        payload.diplomados = getSectionData('dip', 2, true);
                        payload.referencias = getSectionData('ref', 4, false);
                        
                        payload.habilidades_lista = Array.from(document.querySelectorAll('#hab-container > div')).map(row => ({
                            nombre: row.querySelector('.hab-nom').value,
                            desc: row.querySelector('.hab-des').value
                        }));
                        
                        payload.idiomas = document.getElementById('cv-idi').value;
                        payload.intereses = document.getElementById('cv-int').value;
                    } else {
                        payload.experiencia = cv?.experiencia || [];
                        payload.educacion = cv?.educacion || [];
                        payload.cursos = cv?.cursos || [];
                        payload.diplomados = cv?.diplomados || [];
                        payload.referencias = cv?.referencias || [];
                        payload.habilidades_lista = cv?.habilidades_lista || [];
                        payload.idiomas = cv?.idiomas || '';
                        payload.intereses = cv?.intereses || '';
                    }

                    if (cv) await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cvs', cv.id), payload);
                    else await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'cvs'), payload);
                    
                    showToast("¡CV actualizado con éxito!", "success");
                    renderDashboard(targetUser, isFullAccess);
                } catch (err) { 
                    showToast("Error al guardar: " + err.message, "error");
                    btn.innerHTML = btnText;
                }
            };
        }

        function renderEditorSection(title, id, data, placeholders, hasImage) {
            return `
                <div class="bg-slate-800 p-8 rounded-3xl border border-slate-700 shadow-sm">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="font-black text-blue-400 text-xs uppercase">${title}</h3>
                        <button type="button" data-section="${id}" data-fields='${JSON.stringify(placeholders)}' data-image="${hasImage}" class="btn-add-row text-xs bg-slate-700 border border-slate-600 text-white px-4 py-2 rounded-full hover:bg-blue-600 transition-colors">
                            + Añadir Item
                        </button>
                    </div>
                    <div id="${id}-container" class="space-y-4">
                        ${data?.map(item => `
                            <div class="grid grid-cols-1 md:grid-cols-${placeholders.length} gap-2 p-4 bg-slate-900 rounded-2xl border border-slate-700 relative">
                                ${placeholders.map((p, i) => `<input type="text" placeholder="${p}" value="${item['f'+i] || ''}" class="p-2 border border-slate-700 bg-slate-800 text-white rounded-lg text-xs ${id}-field-${i} outline-none focus:border-blue-500">`).join('')}
                                ${hasImage ? `<div class="col-span-full mt-2"><input type="url" placeholder="URL del Certificado (Opcional)" value="${item.img || ''}" class="w-full p-2 border border-slate-700 bg-slate-800 text-white rounded-lg text-xs ${id}-img-url outline-none focus:border-blue-500"></div>` : ''}
                                <button type="button" onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 bg-red-600 text-white w-6 h-6 rounded-full text-xs shadow">×</button>
                            </div>
                        `).join('') || ''}
                    </div>
                </div>`;
        }

        function setupDynamicButtons() {
            document.querySelectorAll('.btn-add-row').forEach(btn => {
                btn.onclick = () => {
                    const id = btn.dataset.section;
                    const placeholders = JSON.parse(btn.dataset.fields);
                    const hasImage = btn.dataset.image === 'true';
                    const container = document.getElementById(`${id}-container`);
                    const div = document.createElement('div');
                    div.className = `grid grid-cols-1 md:grid-cols-${placeholders.length} gap-2 p-4 bg-slate-900 rounded-2xl border border-slate-700 relative animate-fade-in`;
                    
                    let html = placeholders.map((p, i) => `<input type="text" placeholder="${p}" class="p-2 border border-slate-700 bg-slate-800 text-white rounded-lg text-xs ${id}-field-${i} outline-none focus:border-blue-500">`).join('');
                    if (hasImage) html += `<div class="col-span-full mt-2"><input type="url" placeholder="URL del Certificado (Opcional)" class="w-full p-2 border border-slate-700 bg-slate-800 text-white rounded-lg text-xs ${id}-img-url outline-none focus:border-blue-500"></div>`;
                    html += `<button type="button" onclick="this.parentElement.remove()" class="absolute -top-2 -right-2 bg-red-600 text-white w-6 h-6 rounded-full text-xs shadow">×</button>`;
                    div.innerHTML = html;
                    container.appendChild(div);
                };
            });
        }

        // --- FUNCIÓN PARA DESCARGAR EL CV EN PDF PROFESIONAL ---
        window.descargarPDF = (nombreCandidato) => {
            const elementoCV = document.querySelector('.cv-container');
            const zonaBotones = elementoCV.querySelector('.no-print');
            zonaBotones.style.display = 'none';

            const opcionesPDF = {
                margin:       0, 
                filename:     `CV_${nombreCandidato.replace(/\s+/g, '_')}.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, backgroundColor: '#0f172a' }, 
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'portrait' }
            };

            document.body.style.cursor = 'wait';

            html2pdf().set(opcionesPDF).from(elementoCV).save().then(() => {
                zonaBotones.style.display = 'flex';
                document.body.style.cursor = 'default';
                showToast("PDF descargado correctamente", "success");
            });
        };

        window.loadCV = async (cvId) => {
            const snap = await getDoc(doc(db, 'artifacts', appId, 'public', 'data', 'cvs', cvId));
            if (!snap.exists()) {
                showToast("Perfil no encontrado.", "error");
                return;
            }
            const d = snap.data();

            document.getElementById('app-container').innerHTML = `
                <div class="max-w-5xl mx-auto cv-container bg-slate-800 text-slate-200 shadow-2xl rounded-3xl overflow-hidden mb-20 animate-fade-in border border-slate-700">
                    
                    <div class="bg-gradient-to-r from-slate-950 to-blue-900 text-white p-12 relative flex flex-col md:flex-row items-center md:items-start gap-8 border-b border-blue-900/50">
                        <div class="absolute top-4 right-4 no-print flex gap-2 items-center">
                             <button onclick="window.print()" title="Imprimir" class="text-white/50 hover:text-white p-2 transition-colors"><i class="fas fa-print text-xl"></i></button>
                             <button onclick="descargarPDF('${d.nombre}')" class="bg-blue-600 text-white px-4 py-2.5 rounded-xl hover:bg-blue-500 font-black text-xs flex items-center gap-2 shadow-lg transition-all hover:-translate-y-1">
                                 <i class="fas fa-file-pdf text-lg"></i> DESCARGAR PDF
                             </button>
                        </div>
                        
                        ${d.foto ? `<img src="${d.foto}" class="w-32 h-32 md:w-40 md:h-40 rounded-full object-cover border-4 border-slate-800 shadow-2xl flex-shrink-0" crossorigin="anonymous">` : ''}
                        
                        <div class="text-center md:text-left w-full mt-4 md:mt-0">
                            <h2 class="text-5xl font-black uppercase tracking-tighter">${d.nombre || 'Sin Nombre'}</h2>
                            <p class="text-blue-400 font-bold text-xl mt-2 tracking-wide">${d.profesion || ''}</p>
                            
                            <div class="mt-6 flex flex-wrap justify-center md:justify-start gap-5 text-sm opacity-90 font-light">
                                ${d.telefono ? `<span><i class="fas fa-phone mr-2 text-blue-400"></i>${d.telefono}</span>` : ''}
                                ${d.email ? `<span><i class="fas fa-envelope mr-2 text-blue-400"></i>${d.email}</span>` : ''}
                                ${d.direccion ? `<span><i class="fas fa-map-marker-alt mr-2 text-blue-400"></i>${d.direccion}</span>` : ''}
                            </div>
                            
                            <div class="mt-6 flex justify-center md:justify-start gap-5 text-2xl no-print">
                                ${d.redes?.linkedin ? `<a href="${d.redes.linkedin}" target="_blank" class="text-white/60 hover:text-blue-400 transition-colors"><i class="fab fa-linkedin"></i></a>` : ''}
                                ${d.redes?.facebook ? `<a href="${d.redes.facebook}" target="_blank" class="text-white/60 hover:text-blue-400 transition-colors"><i class="fab fa-facebook"></i></a>` : ''}
                                ${d.redes?.instagram ? `<a href="${d.redes.instagram}" target="_blank" class="text-white/60 hover:text-pink-400 transition-colors"><i class="fab fa-instagram"></i></a>` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="p-12 grid grid-cols-1 lg:grid-cols-3 gap-12 bg-slate-800">
                        
                        <div class="lg:col-span-1 space-y-10">
                            <section>
                                <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 mb-4 border-l-4 border-blue-500 pl-3">Datos Personales</h4>
                                <ul class="text-xs space-y-3 text-slate-400">
                                    ${d.info_personal?.cedula ? `<li><strong class="text-slate-200">Cédula:</strong><br> ${d.info_personal.cedula}</li>` : ''}
                                    ${d.info_personal?.estado_civil ? `<li><strong class="text-slate-200">Estado Civil:</strong><br> ${d.info_personal.estado_civil}</li>` : ''}
                                    ${d.info_personal?.nacionalidad ? `<li><strong class="text-slate-200">Nacionalidad:</strong><br> ${d.info_personal.nacionalidad}</li>` : ''}
                                    ${d.info_personal?.nacimiento ? `<li><strong class="text-slate-200">F. Nacimiento:</strong><br> ${d.info_personal.nacimiento}</li>` : ''}
                                </ul>
                            </section>

                            ${d.habilidades_lista && d.habilidades_lista.length > 0 ? `
                            <section>
                                <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 mb-4 border-l-4 border-blue-500 pl-3">Habilidades</h4>
                                <div class="space-y-4">
                                    ${d.habilidades_lista.map(h => `
                                        <div>
                                            <p class="text-[11px] font-bold text-white uppercase">${h.nombre}</p>
                                            <p class="text-[10px] text-slate-400 mt-1">${h.desc}</p>
                                        </div>
                                    `).join('')}
                                </div>
                            </section>` : ''}

                            ${d.idiomas ? `
                            <section>
                                <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 mb-4 border-l-4 border-blue-500 pl-3">Idiomas</h4>
                                <p class="text-xs text-slate-400 leading-relaxed">${d.idiomas}</p>
                            </section>` : ''}

                            ${d.intereses ? `
                            <section>
                                <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 mb-4 border-l-4 border-blue-500 pl-3">Intereses</h4>
                                <p class="text-xs text-slate-400 leading-relaxed">${d.intereses}</p>
                            </section>` : ''}
                        </div>

                        <div class="lg:col-span-2 space-y-12">
                            
                            ${d.objetivo ? `
                            <section>
                                <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 border-b border-slate-700 pb-2 mb-4">Perfil Profesional</h4>
                                <p class="text-sm text-slate-300 leading-relaxed text-justify">${d.objetivo}</p>
                            </section>` : ''}

                            <section>
                                <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 border-b border-slate-700 pb-2 mb-6">Experiencia Laboral</h4>
                                <div class="space-y-6">
                                    ${d.experiencia && d.experiencia.length > 0 ? d.experiencia.map(e => `
                                        <div class="pl-4 border-l-2 border-slate-600 hover:border-blue-500 transition-colors">
                                            <div class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-1">
                                                <p class="font-bold text-white text-sm">${e.f1}</p>
                                                <span class="text-blue-400 text-[10px] font-bold uppercase bg-blue-900/30 border border-blue-800 px-2 py-1 rounded w-fit">${e.f2}</span>
                                            </div>
                                            <p class="text-xs font-semibold text-slate-400 mt-1"><i class="fas fa-building mr-1"></i> ${e.f0}</p>
                                            <p class="text-xs text-slate-300 mt-2 leading-relaxed">${e.f3}</p>
                                        </div>
                                    `).join('') : '<p class="text-xs text-slate-500">Sin experiencia registrada</p>'}
                                </div>
                            </section>

                            <section>
                                <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 border-b border-slate-700 pb-2 mb-6">Educación Académica</h4>
                                <div class="space-y-4">
                                    ${d.educacion && d.educacion.length > 0 ? d.educacion.map(e => `
                                        <div class="bg-slate-900 p-5 rounded-xl border border-slate-700">
                                            <p class="text-sm font-bold text-white">${e.f1}</p>
                                            <p class="text-[11px] text-slate-400 mt-2 flex flex-wrap gap-3">
                                                <span><i class="fas fa-university mr-1"></i> ${e.f0}</span>
                                                <span><i class="fas fa-graduation-cap mr-1"></i> ${e.f2}</span>
                                            </p>
                                            ${e.img ? `<a href="${e.img}" target="_blank" class="inline-block mt-3 text-[10px] bg-blue-900/30 text-blue-400 border border-blue-800 px-3 py-1.5 rounded-lg font-bold hover:bg-blue-900/50 no-print transition-colors"><i class="fas fa-external-link-alt mr-1"></i> Ver Certificado</a>` : ''}
                                        </div>
                                    `).join('') : '<p class="text-xs text-slate-500">Sin registros</p>'}
                                </div>
                            </section>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
                                <section>
                                    <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 border-b border-slate-700 pb-2 mb-5">Cursos y Talleres</h4>
                                    <div class="space-y-5">
                                        ${d.cursos && d.cursos.length > 0 ? d.cursos.map(c => `
                                            <div class="relative pl-3 border-l border-slate-600">
                                                <p class="text-[12px] font-bold text-white leading-tight">${c.f0}</p>
                                                <p class="text-[10px] text-slate-400 mt-1"><i class="fas fa-map-marker-alt mr-1"></i> ${c.f1}</p>
                                                ${c.img ? `<a href="${c.img}" target="_blank" class="inline-block mt-2 text-[10px] text-blue-400 font-bold hover:underline no-print"><i class="fas fa-certificate mr-1"></i> Ver Credencial</a>` : ''}
                                            </div>
                                        `).join('') : '<p class="text-xs text-slate-500">No especificado</p>'}
                                    </div>
                                </section>

                                <section>
                                    <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 border-b border-slate-700 pb-2 mb-5">Diplomados</h4>
                                    <div class="space-y-5">
                                        ${d.diplomados && d.diplomados.length > 0 ? d.diplomados.map(c => `
                                            <div class="relative pl-3 border-l border-slate-600">
                                                <p class="text-[12px] font-bold text-white leading-tight">${c.f0}</p>
                                                <p class="text-[10px] text-slate-400 mt-1"><i class="fas fa-map-marker-alt mr-1"></i> ${c.f1}</p>
                                                ${c.img ? `<a href="${c.img}" target="_blank" class="inline-block mt-2 text-[10px] text-blue-400 font-bold hover:underline no-print"><i class="fas fa-certificate mr-1"></i> Ver Credencial</a>` : ''}
                                            </div>
                                        `).join('') : '<p class="text-xs text-slate-500">No especificado</p>'}
                                    </div>
                                </section>
                            </div>

                            <section>
                                <h4 class="text-xs font-black uppercase tracking-widest text-blue-400 border-b border-slate-700 pb-2 mb-6 mt-6">Referencias Laborales</h4>
                                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    ${d.referencias && d.referencias.length > 0 ? d.referencias.map(r => `
                                        <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 hover:border-blue-500 transition-all">
                                            <p class="text-[13px] font-black text-white">${r.f0}</p>
                                            <p class="text-[11px] text-slate-400 mt-1">${r.f2}</p>
                                            <p class="text-[10px] text-slate-500 mt-0.5"><i class="fas fa-building mr-1 text-slate-600"></i> ${r.f1}</p>
                                            <p class="text-[12px] text-blue-400 font-bold mt-3 bg-blue-900/30 border border-blue-800 w-fit px-2 py-1 rounded"><i class="fas fa-phone mr-1"></i> ${r.f3}</p>
                                        </div>
                                    `).join('') : '<p class="text-xs text-slate-500">Sin referencias</p>'}
                                </div>
                            </section>

                        </div>
                    </div>
                </div>`;
        };

        // --- CONSOLA DE ADMINISTRADOR ---
        window.renderAdminPanel = async () => {
            const container = document.getElementById('app-container');
            container.innerHTML = `
                <div class="max-w-7xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8 animate-fade-in py-8">
                    <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-sm h-fit">
                        <h2 class="text-lg font-black mb-4 text-white border-b border-slate-700 pb-4"><i class="fas fa-users text-blue-500 mr-2"></i> Usuarios</h2>
                        <div class="relative mb-4">
                            <i class="fas fa-search absolute left-3 top-3 text-slate-500 text-xs"></i>
                            <input type="text" id="buscador-admin" placeholder="Buscar usuario..." class="w-full pl-8 p-2 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white outline-none focus:border-blue-500" oninput="filtrarAdmin(this.value)">
                        </div>
                        <div id="admin-list" class="space-y-3 max-h-[500px] overflow-y-auto pr-2"><p class="text-center text-slate-500 text-xs">Cargando...</p></div>
                    </div>
                    <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-sm h-fit">
                        <h2 class="text-lg font-black mb-6 text-white border-b border-slate-700 pb-4"><i class="fas fa-bell text-amber-500 mr-2"></i> Solicitudes de Edición</h2>
                        <div id="solicitudes-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2"></div>
                    </div>
                    <div class="bg-slate-800 p-6 rounded-3xl border border-slate-700 shadow-sm h-fit">
                        <h2 class="text-lg font-black mb-6 text-white border-b border-slate-700 pb-4"><i class="fas fa-gem text-blue-500 mr-2"></i> Pagos PRO</h2>
                        <div id="pagos-list" class="space-y-4 max-h-[500px] overflow-y-auto pr-2"></div>
                    </div>
                </div>
            `;

            window.allAdminUsers = [];
            const users = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'usuarios_sistema'));
            users.forEach(d => { if(d.data().tipo !== 'admin') window.allAdminUsers.push({ id: d.id, ...d.data() }); });
            dibujarListaAdmin(window.allAdminUsers);

            const solicitudes = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'solicitudes'));
            const solList = document.getElementById('solicitudes-list');
            solList.innerHTML = ''; 
            solicitudes.forEach(d => {
                const s = d.data();
                if(s.estado === 'pendiente') {
                    solList.innerHTML += `
                        <div class="bg-slate-900 p-4 rounded-2xl border border-amber-900/50 shadow-sm relative" id="sol-${d.id}">
                            <div class="flex gap-2 mb-2">
                                <button onclick="marcarSolicitudLista('${d.id}')" class="bg-emerald-900/30 text-emerald-400 border border-emerald-800 px-2 py-1 rounded-lg text-[10px] font-bold hover:bg-emerald-800 transition-colors"><i class="fas fa-check mr-1"></i> Listo</button>
                                <button onclick="adminProxy('${s.nombre}', '${s.email}', 'usuario')" class="bg-blue-900/30 text-blue-400 border border-blue-800 px-2 py-1 rounded-lg text-[10px] font-bold hover:bg-blue-800 transition-colors"><i class="fas fa-edit mr-1"></i> Editar</button>
                            </div>
                            <p class="text-xs font-bold text-amber-400 mb-1">${s.nombre}</p>
                            <div class="bg-slate-800 p-2 rounded-lg border border-slate-700 mb-2 text-[10px] text-slate-300 whitespace-pre-wrap">${s.texto}</div>
                        </div>
                    `;
                }
            });
            if(solList.innerHTML === '') solList.innerHTML = '<p class="text-xs text-slate-500 text-center py-5">No hay solicitudes.</p>';

            const pagosReq = await getDocs(collection(db, 'artifacts', appId, 'public', 'data', 'solicitudes_plan'));
            const pagosList = document.getElementById('pagos-list');
            pagosList.innerHTML = '';
            pagosReq.forEach(d => {
                const p = d.data();
                if(p.estado === 'pendiente') {
                    pagosList.innerHTML += `
                        <div class="bg-slate-900 p-4 rounded-2xl border border-blue-900 shadow-sm relative" id="pago-${d.id}">
                            <span class="absolute top-3 right-3 bg-blue-900/50 border border-blue-800 text-blue-400 text-[9px] font-black px-2 py-1 rounded uppercase">${p.tipo_usuario}</span>
                            <p class="text-sm font-black text-white mb-1">${p.nombre}</p>
                            <p class="text-[10px] text-slate-400 mb-4">${p.email} • ${p.fecha}</p>
                            <button onclick="aprobarPlanPRO('${d.id}', '${p.usuario_id}')" class="w-full bg-emerald-600 text-white hover:bg-emerald-500 px-3 py-2 rounded-xl flex items-center justify-center gap-2 text-xs font-bold transition-colors shadow-md">
                                <i class="fas fa-check-double"></i> Aprobar Cuenta PRO
                            </button>
                        </div>
                    `;
                }
            });
            if(pagosList.innerHTML === '') pagosList.innerHTML = '<p class="text-xs text-slate-500 text-center py-5">Todo al día. Sin pagos pendientes.</p>';
        };

        window.dibujarListaAdmin = (lista) => {
            const listContainer = document.getElementById('admin-list');
            listContainer.innerHTML = '';
            lista.forEach(u => {
                listContainer.innerHTML += `
                    <div class="bg-slate-900 p-4 rounded-2xl border border-slate-700 flex flex-col gap-2 hover:border-blue-500 transition-colors">
                        <div>
                            <p class="font-bold text-sm text-white">${u.nombre}</p>
                            <p class="text-[10px] text-slate-400 uppercase">${u.email} <span class="text-blue-500 font-bold ml-1">[${u.tipo}]</span> <span class="text-amber-500 font-black ml-1">[${u.plan || 'GRATIS'}]</span></p>
                        </div>
                        <button onclick="adminProxy('${u.nombre}', '${u.email}', '${u.tipo}')" class="bg-slate-700 text-white border border-slate-600 px-3 py-1.5 rounded-lg text-[10px] font-bold hover:bg-blue-600 w-full transition-colors">Editar Perfil</button>
                    </div>`;
            });
        };

        window.filtrarAdmin = (query) => {
            const q = query.toLowerCase();
            dibujarListaAdmin(window.allAdminUsers.filter(u => (u.nombre && u.nombre.toLowerCase().includes(q)) || (u.email && u.email.toLowerCase().includes(q))));
        };

        window.marcarSolicitudLista = async (id) => {
            if(confirm("¿Estás seguro de marcar esta solicitud como completada?")) {
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'solicitudes', id), { estado: 'completado' });
                document.getElementById('sol-'+id).remove();
                showToast("Solicitud completada", "success");
            }
        };

        window.aprobarPlanPRO = async (reqId, userId) => {
            if(confirm("¿Confirmas que recibiste el pago de este usuario por WhatsApp y deseas activarle el plan PRO por 30 días?")) {
                const fechaExpiracion = new Date();
                fechaExpiracion.setDate(fechaExpiracion.getDate() + 30);
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'usuarios_sistema', userId), { plan: 'pro', expiracion_plan: fechaExpiracion.getTime() });
                await updateDoc(doc(db, 'artifacts', appId, 'public', 'data', 'solicitudes_plan', reqId), { estado: 'aprobado' });
                document.getElementById('pago-'+reqId).remove();
                showToast("¡Cuenta PRO activada!", "success");
            }
        };

        window.adminProxy = (nombre, email, tipo) => {
            const targetUser = {nombre, email, tipo};
            if(tipo === 'empresa') renderEmpresaDashboard(targetUser); 
            else renderDashboard(targetUser, true);
        };

        window.enviarSolicitud = async (email, nombre) => { 
            const texto = document.getElementById('sol-texto').value; 
            const link = document.getElementById('sol-url').value; 
            if(!texto.trim()) return showToast("Debes escribir detalles de lo que quieres modificar.", "error"); 
            
            try { 
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'solicitudes'), { email, nombre, texto, link, estado: 'pendiente', fecha: new Date().toLocaleDateString(), timestamp: serverTimestamp() }); 
                showToast("¡Enviada con éxito! El administrador la revisará pronto.", "success"); 
                document.getElementById('solicitud-box').classList.add('hidden'); 
            } catch(e) { showToast("Error al enviar la solicitud.", "error"); } 
        };

        init();
    </script>
    
    <!-- Footer -->
    <footer class="p-6 text-center text-slate-500 text-sm border-t border-slate-800 mt-auto">
 
        <p>&copy; 2026
            <a href="https://lorhels.web.app" target="\_blank" rel="noopener noreferrer" class="text-blue-400 hover:text-blue-300 transition-colors duration-200 font-medium">
            LorHels Systems
        </a> Todos los derechos reservados.</p>
        <p style="margin-top: 10px; color: #4b5563;">Desarrollado con pasión para brindar las mejores soluciones.</p>
    </footer>
    
</body>
</html>
